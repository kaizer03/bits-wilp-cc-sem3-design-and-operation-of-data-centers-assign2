hostname leaf1
log stdout
!
interface to_s1
 ip ospf area 0.0.0.0
 ip ospf network point-to-multipoint non-broadcast
 ip ospf cost 10
 ip ospf hello-interval 1
 ip ospf dead-interval 4
!
interface to_s2
 ip ospf area 0.0.0.0
 ip ospf network point-to-multipoint non-broadcast
 ip ospf cost 10
 ip ospf hello-interval 1
 ip ospf dead-interval 4
!
interface edge
 ip ospf area 0.0.0.0
 ip ospf cost 1
 ip ospf passive
!
router ospf
 ospf router-id 1.1.1.1
 maximum-paths 2
 neighbor 10.76.0.3 poll-interval 1
 neighbor 10.76.0.11 poll-interval 1
!
