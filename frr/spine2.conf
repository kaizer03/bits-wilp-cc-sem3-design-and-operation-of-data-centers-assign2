hostname spine2
log stdout
!
interface to_l1
 ip ospf area 0.0.0.0
 ip ospf network point-to-multipoint non-broadcast
 ip ospf cost 10
 ip ospf hello-interval 1
 ip ospf dead-interval 4
!
interface to_l2
 ip ospf area 0.0.0.0
 ip ospf network point-to-multipoint non-broadcast
 ip ospf cost 10
 ip ospf hello-interval 1
 ip ospf dead-interval 4
!
router ospf
 ospf router-id 4.4.4.4
 maximum-paths 2
 neighbor 10.76.0.10 poll-interval 1
 neighbor 10.76.0.26 poll-interval 1
!
